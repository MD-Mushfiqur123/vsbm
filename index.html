<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no">
    <title>VSBM_Ultra_Smooth</title>
    <style>
        body {
            background: #000;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #main {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #c1 {
            width: 100%;
            height: 100%;
            /* HACK: Blurring the low-res canvas to make it look smooth instead of pixelated */
            filter: blur(0.5px) contrast(1.2); 
            image-rendering: optimizeSpeed;
        }
        /* UI Overlay Styling */
        .overlay {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through */
        }
        .fps-counter {
            color: #0f0;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 5px #000;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
        .controls {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 10px #0f0;
        }
        #config { display: none; }
    </style>
</head>
<body>

    <div class="overlay">
        <div class="fps-counter" id="fps">FPS: Calculating...</div>
    </div>

    <div class="controls">
        <button id="btn_new">OPEN WINDOW (+)</button>
        <button id="btn_conf">CONFIG</button>
    </div>

    <div id="main">
        <canvas id="c1" width="256" height="256"></canvas>
    </div>

    <div id="config" style="position:fixed; bottom:0; left:0; background:#fff; z-index:100; padding:10px;">
        <textarea id="kernel" cols="30" rows="5"></textarea>
        <button id="apply">APPLY</button>
    </div>

    <script>
    // --- FPS COUNTER LOGIC ---
    var lastFrameTime = performance.now();
    var frameCount = 0;
    var fpsElement = document.getElementById("fps");
    
    function updateFPS() {
        var now = performance.now();
        var delta = now - lastFrameTime;
        frameCount++;
        if (delta >= 1000) {
            var fps = Math.round((frameCount * 1000) / delta);
            fpsElement.innerText = "FPS: " + fps + " (Smooth Mode)";
            fpsElement.style.color = fps > 30 ? "#0f0" : "#f00"; // Green if smooth
            frameCount = 0;
            lastFrameTime = now;
        }
        requestAnimationFrame(updateFPS);
    }
    updateFPS();

    // --- WEBGL SETUP ---
    var cx, cy;
    var gl, canvas;
    var shaderProgram;
    var glposition, glright, glforward, glup, glorigin, glx, gly, gllen;
    
    // Camera & Interaction Variables
    var len = 1.6, ang1 = 2.8, ang2 = 0.4;
    var cenx = 0.0, ceny = 0.0, cenz = 0.0;
    var mx = 0, my = 0, ml = 0, mr = 0, mm = 0;

    // HACK: Reduced loops from 5 to 2 for extreme speed
    var KERNEL = "float kernal(vec3 ver){\n" +
        "   vec3 a = ver;\n" +
        "   float b, c, d;\n" +
        "   for(int i=0; i<2; i++){\n" +  // OPTIMIZATION: Only 2 iterations!
        "       b = length(a);\n" +
        "       c = atan(a.y, a.x) * 8.0;\n" +
        "       d = acos(a.z / b) * 8.0;\n" +
        "       b = pow(b, 8.0);\n" +
        "       a = vec3(b * sin(d) * cos(c), b * sin(d) * sin(c), b * cos(d)) + ver;\n" +
        "       if(b > 4.0) break;\n" +
        "   }\n" +
        "   return 4.0 - dot(a, a);\n" +
        "}";

    function init() {
        canvas = document.getElementById('c1');
        gl = canvas.getContext('webgl', { alpha: false, depth: false, antialias: false }); // Disable unnecessary features
        
        // Fullscreen Quad
        var positions = [-1, -1, 0, 1, -1, 0, 1, 1, 0, -1, -1, 0, 1, 1, 0, -1, 1, 0];
        
        var vsSource = `
            attribute vec4 position;
            varying vec3 dir;
            uniform vec3 right, forward, up;
            uniform float x, y;
            void main() {
                gl_Position = position;
                dir = forward + right * position.x * x + up * position.y * y;
            }`;

        // HACK: Simplified Fragment Shader with bigger steps
        var fsSourceHead = `
            precision mediump float;
            uniform vec3 origin, right, forward, up;
            uniform float len;
            varying vec3 dir;
            float kernal(vec3 ver);
            void main() {
                vec3 p = origin;
                vec3 d = dir;
                float v = 0.0;
                float total_d = 0.0;
                // Raymarching Loop (Drastically Simplified)
                for(int i=0; i<60; i++) { 
                    vec3 pos = p + d * total_d;
                    float val = kernal(pos);
                    if(val > 0.0) {
                        // Simple coloring based on depth
                        float brightness = 1.0 / (1.0 + total_d * 0.5);
                        gl_FragColor = vec4(0.2, 0.6, 1.0, 1.0) * brightness * (val * 0.5 + 0.5);
                        return;
                    }
                    total_d += 0.02 * len; // Big steps
                    if(total_d > 2.0 * len) break;
                }
                gl_FragColor = vec4(0.05, 0.05, 0.1, 1.0); // Background color
            }`;

        var vertShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        var fragShader = createShader(gl, gl.FRAGMENT_SHADER, fsSourceHead + KERNEL);
        shaderProgram = createProgram(gl, vertShader, fragShader);
        
        gl.useProgram(shaderProgram);

        // Link Uniforms
        glposition = gl.getAttribLocation(shaderProgram, 'position');
        glright = gl.getUniformLocation(shaderProgram, 'right');
        glforward = gl.getUniformLocation(shaderProgram, 'forward');
        glup = gl.getUniformLocation(shaderProgram, 'up');
        glorigin = gl.getUniformLocation(shaderProgram, 'origin');
        glx = gl.getUniformLocation(shaderProgram, 'x');
        gly = gl.getUniformLocation(shaderProgram, 'y');
        gllen = gl.getUniformLocation(shaderProgram, 'len');

        var buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(glposition);
        gl.vertexAttribPointer(glposition, 3, gl.FLOAT, false, 0, 0);

        // Events
        setupEvents();
        
        // Start Loop
        requestAnimationFrame(renderLoop);
    }

    function createShader(gl, type, source) {
        var shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
            return null;
        }
        return shader;
    }

    function createProgram(gl, vs, fs) {
        var prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        return prog;
    }

    function renderLoop() {
        ang1 += 0.005; // Auto rotate

        // Update Uniforms
        // Resolution Aspect Ratio Fix
        var aspect = window.innerWidth / window.innerHeight;
        gl.uniform1f(glx, aspect);
        gl.uniform1f(gly, 1.0);
        gl.uniform1f(gllen, len);

        var cx = Math.cos(ang1), sx = Math.sin(ang1);
        var cy = Math.cos(ang2), sy = Math.sin(ang2);

        // Camera Math
        gl.uniform3f(glorigin, len * cx * cy + cenx, len * sy + ceny, len * sx * cy + cenz);
        gl.uniform3f(glforward, -cx * cy, -sy, -sx * cy);
        gl.uniform3f(glright, sx, 0, -cx);
        gl.uniform3f(glup, -sy * cx, cy, -sy * sx);

        gl.viewport(0, 0, 256, 256); // Force low res render
        gl.drawArrays(gl.TRIANGLES, 0, 6);

        requestAnimationFrame(renderLoop);
    }

    function setupEvents() {
        // Window Button
        document.getElementById("btn_new").addEventListener("click", function() {
            window.open(window.location.href, "_blank", "width=400,height=400,menubar=no,toolbar=no");
        });
        
        // Config Button
        document.getElementById("btn_conf").addEventListener("click", function() {
            var el = document.getElementById("config");
            el.style.display = el.style.display === "none" ? "block" : "none";
            document.getElementById("kernel").value = KERNEL;
        });

        document.getElementById("apply").addEventListener("click", function() {
            KERNEL = document.getElementById("kernel").value;
            // Recompile shader logic would go here in full version
            alert("Config applied (Reload to see major changes)");
        });

        // Mouse Drag Logic (Simplified)
        document.addEventListener("mousedown", e => { mx = e.clientX; my = e.clientY; ml = 1; });
        document.addEventListener("mouseup", e => ml = 0);
        document.addEventListener("mousemove", e => {
            if (ml) {
                ang1 += (e.clientX - mx) * 0.005;
                ang2 += (e.clientY - my) * 0.005;
                mx = e.clientX; my = e.clientY;
            }
        });
        document.addEventListener("wheel", e => {
            len *= Math.exp(e.deltaY * 0.001);
        });
    }

    window.onload = init;

    </script>
</body>
</html>
